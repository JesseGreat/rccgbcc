<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d0d" />
    <title>No connection · Bethel Sunday School</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: #f4f4f7; color: #1a1a1a; text-align: center;
        font: 17px/1.5 "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 26rem; width: 100%; }
      .badge { width: 5rem; height: 5rem; margin: 0 auto; border-radius: 50%; background: #e7edf6;
        display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 1.6rem; margin: 1.5rem 0 0.5rem; }
      p { margin: 0.5rem 0; color: #5f6168; font-size: 1.125rem; }
      .brand { margin: -1.5rem -1rem 2rem; padding: 1.5rem 1rem 1.75rem; border-radius: 0 0 2rem 2rem;
        background: linear-gradient(180deg, #0e0d0d 0%, #0e0d0d 38%, #06044d 72%, #0913d5 100%); }
      .brand img { width: 13rem; max-width: 70%; height: auto; }
      button { margin-top: 2rem; width: 100%; max-width: 20rem; height: 3.5rem; border: 0; border-radius: 1rem;
        background: #1b3a6b; color: #ffffff; font: inherit; font-size: 1.25rem; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 4px solid rgba(27, 58, 107, 0.35); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="/brand/bcc-logo.png" alt="RCCG Bethel Christian Centre" width="800" height="292" /></div>
      <div class="badge" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1b3a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2-1.64" /><path d="M2 8.82a15 15 0 0 1 4.18-2.68" /><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>No connection. Please try again.</h1>
      <p>Attendance needs the internet so it is marked at the right time.</p>
      <p>Check your data or WiFi. If you can't connect, your teacher can mark you in.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
